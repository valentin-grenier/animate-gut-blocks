name: Release (bump + deploy)

# Workflow déclenché À LA MAIN depuis l'onglet Actions (« Run workflow »).
# Il : calcule la nouvelle version (patch/minor/major ou custom), met à jour
# tous les fichiers, commit le bump sur main, crée le tag + la Release GitHub,
# build les assets, puis déploie vers le SVN WordPress.org via l'action 10up.
#
# La Release étant créée par le GITHUB_TOKEN, elle NE redéclenche PAS le
# workflow deploy.yml (pas de double déploiement).
#
# Secrets requis : SVN_USERNAME, SVN_PASSWORD (identifiants WordPress.org).

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Type de version"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: patch
        required: true
      custom_version:
        description: "Version personnalisée X.Y.Z (uniquement si type = custom)"
        type: string
        required: false
      changelog:
        description: "Changelog — puces séparées par « | ». Vide = message par défaut."
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Bump, release and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          if [ "$BUMP_TYPE" = "custom" ]; then
            TARGET="$CUSTOM_VERSION"
            if [ -z "$TARGET" ]; then
              echo "::error::bump_type = custom mais custom_version est vide."
              exit 1
            fi
          else
            TARGET="$BUMP_TYPE"
          fi
          NEW_VERSION="$(bash bin/bump-version.sh "$TARGET" "$CHANGELOG")"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Nouvelle version : $NEW_VERSION"

      - name: Commit and push version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add -A
          git commit -m "chore: Bump version to $VERSION"
          git push origin HEAD:main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          if [ -z "$CHANGELOG" ]; then
            NOTES="Update to version $VERSION"
          else
            NOTES="$(printf '%s' "$CHANGELOG" | sed 's/[[:space:]]*|[[:space:]]*/\n/g')"
          fi
          gh release create "$VERSION" \
            --target main \
            --title "$VERSION" \
            --notes "$NOTES"

      # npm install (et non npm ci) : aucun package-lock.json n'est commité.
      - name: Install dependencies
        run: npm install

      - name: Build production assets
        run: npm run build

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: simple-block-animations
          VERSION: ${{ steps.bump.outputs.version }}
